# Continuous integration.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# THIS FILE IS TEMPORARY. Once `cloudsforge/.github` exists (AD-03) everything below except the
# `contracts` job is deleted and replaced by a call to the shared reusable workflow. The measured
# target in docs/ecosystem/03 §5 is zero repositories with a bespoke CI file, so treat every line
# here as a liability with a deletion date rather than as something to extend.
#
# The `contracts` job is the exception: it is specific to this repository and it stays.
# ────────────────────────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        # Not a secret: this database exists for the duration of one job, is reachable only from
        # it, and holds nothing. A real value here would be a real value in a public log.
        env:
          POSTGRES_USER: mint
          POSTGRES_PASSWORD: mint
          POSTGRES_DB: mint_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Temporary: the three checkouts and the sibling layout exist only because the runtime and
      # contracts packages are unpublished. On publish this collapses to one checkout.
      - uses: actions/checkout@v4
        with: { path: mint }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-runtime, path: runtime, token: "${{ secrets.ESTATE_READ_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-contracts, path: contracts, token: "${{ secrets.ESTATE_READ_TOKEN }}" }

      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mint/pnpm-lock.yaml

      # `link:` resolves to the sibling's own node_modules, so the siblings must be installed
      # before this repository is — without this, `tsc` cannot resolve the sibling source it
      # typechecks (jose, @opentelemetry/api, @cloudsforge/contracts-chain) and `tsx` cannot load
      # @cloudsforge/* at run time.
      - name: Install the sibling runtime and contracts
        run: |
          set -euo pipefail
          pnpm --dir runtime install --frozen-lockfile
          pnpm --dir contracts install --frozen-lockfile

      - name: Install
        working-directory: mint
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: mint
        run: pnpm typecheck

      - name: Migrate the test database
        working-directory: mint
        # The migrator is exercised as a migrator, on an empty database, exactly as a deploy runs
        # it. A schema created by the test suite instead would never prove the one-shot job works —
        # and this service's three CHECK constraints only exist because that job ran.
        env:
          MINT_DATABASE_URL: postgres://mint:mint@127.0.0.1:5432/mint_test
          IDENTITY_JWKS_URL: http://127.0.0.1:4001/.well-known/jwks.json
          IDENTITY_ISSUER: http://127.0.0.1:4001
          OUTBOX_SIGNING_SECRET: ci-only-not-a-real-secret-000000000000
          CUSTODY_URL: http://127.0.0.1:4005
          INDEXER_URL: http://127.0.0.1:4008
          LEDGER_URL: http://127.0.0.1:4007
          MINT_SERVICE_TOKEN: ci-only-not-a-real-token-0000000000000
        run: pnpm migrate

      - name: Test
        working-directory: mint
        env:
          MINT_TEST_DATABASE_URL: postgres://mint:mint@127.0.0.1:5432/mint_test
        run: pnpm test

  indexer-routes:
    name: The indexer serves every path this service asks it for
    runs-on: ubuntu-latest
    # This job exists because both methods of `src/indexerclient.ts` requested paths micro-indexer
    # has never served, and nothing in 113 passing tests noticed: every one of them stubbed the
    # client rather than asking whether the request could reach a route. `token()` therefore
    # returned null on every call and every project page rendered its supply and authorities as
    # "not yet indexed", permanently (18-build-status §3.3i).
    #
    # It is a JOB and not a test for the reason micro-sdk's `drift` and `gateway` jobs already
    # state: an invariant that needs a private sibling checkout cannot be a test, because
    # `pnpm test` must pass for somebody who has only this repository — so it would have to skip,
    # and a skipped test is an unmeasured one.
    steps:
      - uses: actions/checkout@v4

      # Source only, read as TEXT. Importing it would mean resolving another repository's
      # @cloudsforge/* workspace, and rule 2 forbids reaching into a sibling checkout from source.
      - name: Fetch the indexer's route table
        uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-indexer
          ref: main
          path: .indexer
          # micro-indexer is private and the job token is scoped to THIS repository, so it cannot
          # see another one. Same failure, and same fix, as the two sibling checkouts above.
          token: ${{ secrets.ESTATE_READ_TOKEN || github.token }}
          sparse-checkout: |
            src/server.ts

      # No skip path: a checkout that silently produced nothing is exit 1 here, loudly, rather than
      # being graded as agreeing.
      - name: Every path this client requests is a route the indexer serves
        run: node scripts/checkindexerroutes.mjs --indexer .indexer

      - name: …and the check would notice if they disagreed
        # The assertion that makes the step above mean something. It is not enough that the checker
        # says "all good": it has to be shown, against the REAL committed files, that it can say
        # otherwise. Two mutations, because there are two ways for the sides to drift apart.
        #
        # The route is COMMENTED OUT rather than deleted, deliberately. The text is then still in
        # the file and only comment-stripping makes the difference — so this proves in one step
        # that the checker reads the real table AND that it still tells a route from a sentence
        # about one, which is the bug that has now made six guards in this estate pass wrongly.
        run: |
          set -euo pipefail

          real=.indexer/src/server.ts
          mutant="$RUNNER_TEMP/mutant-indexer"
          mkdir -p "$mutant/src"
          sed "s|^\(.*'/tokens/:chain/:network/:address'.*\)$|// \1|" "$real" > "$mutant/src/server.ts"
          if diff -q "$real" "$mutant/src/server.ts" >/dev/null; then
            echo "::error::the mutation changed nothing — the token route is not where this step thinks"
            exit 1
          fi
          if node scripts/checkindexerroutes.mjs --indexer "$mutant"; then
            echo "::error::the check passed a table whose token route is commented out — it is not reading the table"
            exit 1
          fi

          # And the other direction: the client asks for the path it used to ask for, which is the
          # exact defect. Note that it begins `/v1/chains/`, which IS a prefix the indexer serves —
          # a prefix check would pass this, which is why the checker compares whole shapes.
          client="$RUNNER_TEMP/mutant-client.ts"
          sed 's|/v1/transactions/|/v1/chains/|' src/indexerclient.ts > "$client"
          if diff -q src/indexerclient.ts "$client" >/dev/null; then
            echo "::error::the mutation changed nothing — the transaction path is not where this step thinks"
            exit 1
          fi
          if node scripts/checkindexerroutes.mjs --indexer .indexer --client "$client"; then
            echo "::error::the check passed a client asking for a path the indexer does not serve"
            exit 1
          fi

          echo 'ok: the check goes red from either side, so a pass is evidence'

  contracts:
    name: Committed bytecode reproduces from the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # This works because `solc` and `@openzeppelin/contracts` are EXACT-pinned and the install is
      # frozen. Loosen either pin to a caret range and the job stops proving anything: the
      # recompile would produce different bytes on a different day and the diff would be noise.
      - name: Recompile and diff
        run: |
          pnpm compile:contracts
          if ! git diff --exit-code -- src/contracts/generated.ts; then
            echo '::error::src/contracts/generated.ts does not match src/contracts/ForgeTokens.sol — run `pnpm compile:contracts` and commit the result'
            exit 1
          fi
          echo 'ok: the committed bytecode reproduces from the source'

  # The estate-wide rules from docs/ecosystem/03 §2, as checks rather than as review discipline.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Rule 1 — one database, and it is this service''s own'
        run: |
          if grep -rnE '[A-Z_]*DATABASE_URL' src/ --include='*.ts' \
             | grep -vE 'MINT_DATABASE_URL|MINT_TEST_DATABASE_URL'; then
            echo '::error::a connection string other than MINT_DATABASE_URL is referenced'
            exit 1
          fi
          if grep -rnE '(postgres|postgresql)://' src/ --include='*.ts' | grep -v '\.test\.ts'; then
            echo '::error::a literal connection string appears outside a test'
            exit 1
          fi

      - name: 'Rule 4 — livez, readyz and metrics exist'
        run: |
          for endpoint in /livez /readyz /metrics; do
            grep -q "'$endpoint'" src/server.ts \
              || { echo "::error::$endpoint is not served"; exit 1; }
          done

      - name: 'Rule 7 — migrations are never run by the service process'
        run: |
          if grep -nE '\bmigrate\(' src/index.ts; then
            echo '::error::index.ts calls migrate — that is the migrator job, not the service'
            exit 1
          fi

      - name: 'Rule 8 — every background timer is a leased job'
        # Comment lines are excluded: this repository DISCUSSES the frozen service's timers, and a
        # check that cannot tell a timer from a sentence about one is a check people learn to
        # ignore.
        run: |
          if grep -rnE '\bset(Interval|Timeout)\(' src/ --include='*.ts' \
             | grep -v '\.test\.ts' \
             | grep -vE '^[^:]+:[0-9]+: *(//|\*)'; then
            echo '::error::a timer was found; background work is a leased job (@cloudsforge/jobs)'
            exit 1
          fi

      # The deploy must not be able to crawl back inside the request. This is the defect the whole
      # service exists to fix and it is cheap to assert.
      - name: 'The deploy route answers 202 and enqueues'
        run: |
          grep -q 'status: 202' src/server.ts \
            || { echo '::error::the deploy route no longer answers 202'; exit 1; }

      # A `*/` in the MIDDLE of a block comment terminates it early and silently uncomments
      # whatever follows. The pattern matches a continuation line of a block comment (leading `*`)
      # that carries a `*/` with more text after it — which is the only shape that does damage.
      # A single-line `/** … */` is fine and is not matched.
      - name: 'No comment-terminating sequence inside a block comment'
        run: |
          if grep -rnE '^\s*\*.*\*/.+' src/ --include='*.ts'; then
            echo '::error::a */ appears mid-way through a block comment and terminates it early'
            exit 1
          fi
