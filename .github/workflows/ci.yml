name: CI

# ────────────────────────────────────────────────────────────────────────────────────────────────
# The estate-wide half of this file is a CALL, not a copy. The 261 lines it replaces said so
# themselves: everything but the `contracts` job was "a liability with a deletion date".
#
# WHAT THE COPY COST WHILE IT SURVIVED. service-ci.yml runs a step no bespoke file had: it derives
# every scope this service's route gates demand and fails if one is absent from the registry in
# @cloudsforge/contracts-auth. identity refuses to mint a token naming an unknown scope, so an
# unregistered scope is a service-to-service surface no identity-issued token can ever reach — and
# the suite stays green regardless, because it mints its own principals. mint:read and mint:write
# have been gating routes here with nothing checking either.
#
# TWO JOBS SURVIVE BECAUSE THEY PROVE THINGS NO SHARED WORKFLOW CAN.
#
#   `contracts` recompiles src/contracts/ForgeTokens.sol and fails on any diff against the
#   COMMITTED src/contracts/generated.ts. That is what stops the bytecode this service deploys
#   drifting from the source a reviewer read, and it only works because solc and
#   @openzeppelin/contracts are EXACT-pinned and the install is frozen.
#
#   `indexer-routes` exists because both methods of src/indexerclient.ts requested paths
#   micro-indexer has never served, and nothing in 113 passing tests noticed: every one of them
#   stubbed the client rather than asking whether the request could reach a route. token()
#   therefore returned null on every call and every project page rendered its supply and
#   authorities as "not yet indexed", permanently. It is a JOB and not a test because it needs a
#   private sibling checkout, and `pnpm test` must pass for somebody who has only this repository
#   — so as a test it would have to skip, and a skipped test is an unmeasured one.
# ────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: mint
      database-env-var: MINT_DATABASE_URL
      port: 4000
      # Match production rather than the workflow's default of 16: the estate's compose files pin
      # postgres:17-alpine, and a suite that passes on a version nobody runs proves nothing.
      postgres-version: '17'
      # The image smoke test boots the real service, and src/env.ts validates its configuration at
      # import — so the container needs the variables it declares, not just a database, or it exits
      # before it can serve /livez. The upstream URLs are CI-only NON-secrets, never dialled because
      # /livez needs no upstream, and `MINT_SERVICE_TOKEN` is the retired variable env.ts reads only
      # to report that it is set and ignored. Never a real credential.
      #
      # `OUTBOX_SIGNING_SECRET=@generate` asks service-ci.yml for a fresh `openssl rand -base64 48`
      # per run. It used to be `ci-only-not-a-real-secret-000000000000`, described here as a
      # throwaway that only had to clear a length check — and that description was the defect:
      # a value shaped exactly like the placeholder that sat in a PUBLIC compose file cleared every
      # guard in the estate (micro-org #142). The boot guard now checks SHAPE and has no CI
      # exemption, so CI holds a real secret rather than a string claiming to be one.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=@generate
        CUSTODY_URL=http://127.0.0.1:4005
        INDEXER_URL=http://127.0.0.1:4008
        LEDGER_URL=http://127.0.0.1:4007
        PRICING_URL=http://127.0.0.1:4009
        MINT_SERVICE_TOKEN=ci-only-not-a-real-token-0000000000000
    secrets:
      # @cloudsforge/* resolves through link:../runtime and link:../contracts rather than a
      # registry, so the workflow checks out micro-runtime and micro-contracts as siblings. Both are
      # private, so it needs a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  indexer-routes:
    name: The indexer serves every path this service asks it for
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Source only, read as TEXT. Importing it would mean resolving another repository's
      # @cloudsforge/* workspace, and rule 2 forbids reaching into a sibling checkout from source.
      - name: Fetch the indexer's route table
        uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-indexer
          ref: main
          path: .indexer
          # micro-indexer is private and the job token is scoped to THIS repository, so it cannot
          # see another one.
          token: ${{ secrets.ESTATE_READ_TOKEN || github.token }}
          sparse-checkout: |
            src/server.ts

      # No skip path: a checkout that silently produced nothing is exit 1 here, loudly, rather than
      # being graded as agreeing.
      - name: Every path this client requests is a route the indexer serves
        run: node scripts/checkindexerroutes.mjs --indexer .indexer

      - name: …and the check would notice if they disagreed
        # The assertion that makes the step above mean something. It is not enough that the checker
        # says "all good": it has to be shown, against the REAL committed files, that it can say
        # otherwise. Two mutations, because there are two ways for the sides to drift apart.
        #
        # The route is COMMENTED OUT rather than deleted, deliberately. The text is then still in
        # the file and only comment-stripping makes the difference — so this proves in one step
        # that the checker reads the real table AND that it still tells a route from a sentence
        # about one, which is the bug that has now made six guards in this estate pass wrongly.
        run: |
          set -euo pipefail

          real=.indexer/src/server.ts
          mutant="$RUNNER_TEMP/mutant-indexer"
          mkdir -p "$mutant/src"
          sed "s|^\(.*'/tokens/:chain/:network/:address'.*\)$|// \1|" "$real" > "$mutant/src/server.ts"
          if diff -q "$real" "$mutant/src/server.ts" >/dev/null; then
            echo "::error::the mutation changed nothing — the token route is not where this step thinks"
            exit 1
          fi
          if node scripts/checkindexerroutes.mjs --indexer "$mutant"; then
            echo "::error::the check passed a table whose token route is commented out — it is not reading the table"
            exit 1
          fi

          # And the other direction: the client asks for the path it used to ask for, which is the
          # exact defect. Note that it begins `/v1/chains/`, which IS a prefix the indexer serves —
          # a prefix check would pass this, which is why the checker compares whole shapes.
          client="$RUNNER_TEMP/mutant-client.ts"
          sed 's|/v1/transactions/|/v1/chains/|' src/indexerclient.ts > "$client"
          if diff -q src/indexerclient.ts "$client" >/dev/null; then
            echo "::error::the mutation changed nothing — the transaction path is not where this step thinks"
            exit 1
          fi
          if node scripts/checkindexerroutes.mjs --indexer .indexer --client "$client"; then
            echo "::error::the check passed a client asking for a path the indexer does not serve"
            exit 1
          fi

          echo 'ok: the check goes red from either side, so a pass is evidence'

  contracts:
    name: Committed bytecode reproduces from the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # This works because `solc` and `@openzeppelin/contracts` are EXACT-pinned and the install is
      # frozen. Loosen either pin to a caret range and the job stops proving anything: the
      # recompile would produce different bytes on a different day and the diff would be noise.
      - name: Recompile and diff
        run: |
          pnpm compile:contracts
          if ! git diff --exit-code -- src/contracts/generated.ts; then
            echo '::error::src/contracts/generated.ts does not match src/contracts/ForgeTokens.sol — run `pnpm compile:contracts` and commit the result'
            exit 1
          fi
          echo 'ok: the committed bytecode reproduces from the source'

  controls:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Rule 7 — migrations are never run by the service process'
        # A service that migrates on boot turns a rolling deploy into N migrators racing each other
        # and a failed migration into a crash-loop rather than a job that stopped.
        run: |
          if grep -nE '\bmigrate\(' src/index.ts; then
            echo '::error::index.ts calls migrate — that is the migrator job, not the service'
            exit 1
          fi
          echo 'ok: the service process does not migrate'

      - name: 'Rule 8 — every background timer is a leased job'
        # The shared workflow bans setInterval. This repository bans setTimeout with it.
        # Comment lines are excluded: this repository DISCUSSES the frozen service's timers, and a
        # check that cannot tell a timer from a sentence about one is a check people learn to
        # ignore.
        run: |
          if grep -rnE '\bset(Interval|Timeout)\(' src/ --include='*.ts' \
             | grep -v '\.test\.ts' \
             | grep -vE '^[^:]+:[0-9]+: *(//|\*)'; then
            echo '::error::a timer was found; background work is a leased job (@cloudsforge/jobs)'
            exit 1
          fi
          echo 'ok: no unmarked timer'

      # The deploy must not be able to crawl back inside the request. This is the defect the whole
      # service exists to fix and it is cheap to assert.
      - name: 'The deploy route answers 202 and enqueues'
        run: |
          grep -q 'status: 202' src/server.ts \
            || { echo '::error::the deploy route no longer answers 202'; exit 1; }
          echo 'ok: the deploy route answers 202'

      # A `*/` in the MIDDLE of a block comment terminates it early and silently uncomments
      # whatever follows. The pattern matches a continuation line of a block comment (leading `*`)
      # that carries a `*/` with more text after it — which is the only shape that does damage.
      # A single-line `/** … */` is fine and is not matched.
      - name: 'No comment-terminating sequence inside a block comment'
        run: |
          if grep -rnE '^\s*\*.*\*/.+' src/ --include='*.ts'; then
            echo '::error::a */ appears mid-way through a block comment and terminates it early'
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts, image name derived
  # at tools/registry.ts); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts); and deploy/scripts/release-deploy.sh refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [estate, indexer-routes, contracts, controls]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
